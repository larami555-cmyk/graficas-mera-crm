[build]
  publish = "."
  command = "npm install"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."crm-investigar"]
  timeout = 26

[[redirects]]
  from = "/"
  to = "/crm/"
  status = 302

[[headers]]
  for = "/crm/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
