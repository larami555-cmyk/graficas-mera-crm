<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Gráficas Mera — Materiales y productos</title>
<link rel="icon" href="../crm/images/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="../crm/images/icon-180.png">
<meta name="theme-color" content="#d3d0d3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --steel-950:#d3d0d3; --steel-900:#dbd9db; --steel-850:#e6e4e6; --steel-800:#eeeced;
    --steel-700:#b9b6b9; --line:#b5b2b5;
    --paper:#232323; --paper-dim:#6e6b6e; --ink:#d93395; --ink-dim:#a12571;
    --cyan:#2fa876; --cyan-dim:#cdf3e0; --cyan-text:#1c8256;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{background:var(--steel-950);color:var(--paper);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Archivo Black',sans-serif;letter-spacing:-.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  #loginScreen{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  #loginBox{width:100%;max-width:340px;text-align:center;}
  #loginBox .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin-bottom:10px;}
  #loginBox h1{font-size:21px;margin:0 0 26px;}
  #loginBox input{width:100%;background:var(--steel-850);border:1px solid var(--line);border-radius:3px;padding:12px 14px;color:var(--paper);font-family:'Inter',sans-serif;font-size:14px;text-align:center;margin-bottom:12px;padding-right:44px;}
  #loginBox input:focus{outline:none;border-color:var(--ink-dim);}
  #loginBox button{width:100%;background:var(--ink);color:#fff;border:none;border-radius:3px;padding:12px;font-weight:600;font-size:13.5px;cursor:pointer;}
  #loginBox button:hover{background:#f04dae;}
  #loginError{color:#b8382a;font-size:12.5px;margin-top:12px;min-height:16px;}

  #app{display:none;max-width:1000px;margin:0 auto;padding:30px 20px 80px;}
  #app.ready{display:block;}

  #topBar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  #topBar .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin-bottom:6px;}
  #topBar h1{font-size:22px;margin:0 0 4px;}
  #topBar .sub{font-size:12.5px;color:var(--paper-dim);}
  #topBar a.backLink{color:var(--paper-dim);font-size:12.5px;text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:3px;}
  #topBar a.backLink:hover{border-color:var(--ink-dim);color:var(--paper);}

  #controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  #searchInput{flex:1;min-width:180px;background:var(--steel-850);border:1px solid var(--line);color:var(--paper);padding:10px 12px;border-radius:3px;font-size:13.5px;font-family:'Inter',sans-serif;}
  #searchInput:focus{outline:none;border-color:var(--ink-dim);}
  #categoryFilter{background:var(--steel-850);border:1px solid var(--line);color:var(--paper);padding:10px 12px;border-radius:3px;font-size:13.5px;font-family:'Inter',sans-serif;}
  #addBtn{background:var(--ink);color:#fff;border:none;border-radius:3px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;}
  #addBtn:hover{background:#f04dae;}

  .tabBtn{background:var(--steel-850);border:1px solid var(--line);color:var(--paper-dim);border-radius:3px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .tabBtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tabBtn:not(.active):hover{border-color:var(--ink-dim);color:var(--paper);}

  #emptyList{padding:50px 20px;text-align:center;color:var(--paper-dim);font-size:13px;line-height:1.6;}

  #grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .card{background:var(--steel-900);border:1px solid var(--line);border-radius:5px;padding:16px 18px;}
  .card .cardTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .card h3{font-size:16px;margin:0 0 4px;color:var(--paper);font-family:'Inter',sans-serif;font-weight:700;}
  .card .cat{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--cyan-dim);color:var(--cyan-text);padding:2px 8px;border-radius:20px;}
  .chipRow{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{display:inline-block;background:var(--steel-800);border:1px solid var(--line);color:var(--paper);font-size:12px;padding:4px 10px;border-radius:20px;}
  .chip.gm{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan-text);}
  .card .cat.empty{background:var(--steel-800);color:var(--paper-dim);}
  .card .cardBtns{display:flex;gap:6px;flex-shrink:0;}
  .card .iconBtn{background:none;border:1px solid var(--line);color:var(--paper-dim);border-radius:3px;padding:5px 8px;cursor:pointer;font-size:12px;}
  .card .iconBtn:hover{border-color:var(--ink-dim);color:var(--paper);}
  .card label{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--paper-dim);margin:10px 0 3px;}
  .card .val{font-size:13.5px;color:var(--paper);line-height:1.55;white-space:pre-wrap;}
  .card .val.empty{color:var(--paper-dim);font-style:italic;font-size:12.5px;}

  .overlay{position:fixed;inset:0;background:rgba(8,9,10,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--steel-900);border:1px solid var(--line);border-radius:6px;width:100%;max-width:520px;padding:26px;max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 18px;font-size:19px;color:var(--paper);}
  .modal .fld{margin-bottom:14px;}
  .modal .fld label{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:5px;}
  .modal .fld input, .modal .fld select, .modal .fld textarea{width:100%;background:var(--steel-850);border:1px solid var(--line);border-radius:3px;padding:9px 11px;color:var(--paper);font-family:'Inter',sans-serif;font-size:13.5px;resize:vertical;}
  .modal .fld textarea{min-height:80px;line-height:1.5;}
  .modal .fld input:focus, .modal .fld select:focus, .modal .fld textarea:focus{outline:none;border-color:var(--ink-dim);}
  .modalBtns{display:flex;justify-content:space-between;gap:8px;margin-top:18px;}
  .modalBtns .right{display:flex;gap:8px;}

  .checkChip{display:flex;align-items:center;gap:5px;background:var(--steel-850);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12.5px;cursor:pointer;user-select:none;}
  .checkChip input{margin:0;}
  .checkChip.checked{background:var(--cyan-dim);border-color:var(--cyan);color:var(--cyan-text);}
  button.action{font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;border-radius:3px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--steel-850);color:var(--paper);}
  button.action:hover{border-color:var(--ink-dim);}
  button.action.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  button.action.primary:hover{background:#f04dae;}
  button.action.danger{color:#b8382a;}
  button.action.danger:hover{border-color:var(--ink);}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--steel-800);border:1px solid var(--ink-dim);color:var(--paper);
    padding:11px 18px;border-radius:4px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:100;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width: 720px){
    #grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div id="loginBox">
    <div class="eyebrow">Gráficas Mera</div>
    <h1 class="display">Materiales y productos</h1>
    <div style="position:relative;">
      <input id="loginInput" type="password" placeholder="Contraseña de acceso" autocomplete="current-password">
      <button type="button" onclick="togglePasswordVisibility()" aria-label="Mostrar contraseña"
        style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;padding:6px;cursor:pointer;color:var(--paper-dim);width:auto;font-size:16px;line-height:1;">
        <span id="eyeIcon">👁</span>
      </button>
    </div>
    <button onclick="tryLogin()">Entrar</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="app">
  <div id="topBar">
    <div>
      <div class="eyebrow">Gráficas Mera · A Coruña</div>
      <h1 class="display">Materiales y productos</h1>
    </div>
    <a class="backLink" href="../crm/">← Volver al CRM</a>
    <button class="action" style="margin-left:8px;" onclick="exportarCopia()">⬇ Exportar copia</button>
  </div>

  <div id="tabs" style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
    <button class="tabBtn" id="tabBuscar" onclick="switchTab('buscar')">🔎 Buscar</button>
    <button class="tabBtn active" id="tabMateriales" onclick="switchTab('materiales')">Materiales</button>
    <button class="tabBtn" id="tabProductos" onclick="switchTab('productos')">Productos</button>
    <button class="tabBtn" id="tabMaquinas" onclick="switchTab('maquinas')">Máquinas</button>
    <button class="tabBtn" id="tabVehiculos" onclick="switchTab('vehiculos')">Rotulación de vehículos</button>
    <button class="tabBtn" id="tabNotas" onclick="switchTab('notas')">Cómo imprimimos</button>
    <button class="tabBtn" id="tabNotasGenerales" onclick="switchTab('notasgenerales')">Notas</button>
  </div>

  <div id="controls">
    <input id="searchInput" placeholder="Buscar material...">
    <select id="categoryFilter">
      <option value="">Todas las categorías</option>
      <option value="Láser">Láser</option>
      <option value="Rotulación">Rotulación</option>
      <option value="Merchandising">Merchandising</option>
      <option value="Imprenta">Imprenta</option>
      <option value="Textil">Textil</option>
      <option value="Papel">Papel</option>
      <option value="General">General</option>
    </select>
    <button id="addBtn">+ Añadir material</button>
  </div>

  <div id="grid"></div>

  <div id="notesPanel" style="display:none;">
    <p id="notesIntro" style="color:var(--paper-dim);font-size:12.5px;margin:0 0 12px;">Espacio libre para tus propios comentarios: procesos, trucos, cosas a recordar de cómo imprimís cada cosa.</p>
    <textarea id="notesTextarea" placeholder="Escribe aquí tus notas sobre cómo imprimimos..." style="width:100%;min-height:400px;background:var(--steel-850);border:1px solid var(--line);border-radius:5px;padding:16px;color:var(--paper);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;resize:vertical;"></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
      <span id="notesSavedLabel" style="font-size:12px;color:var(--paper-dim);"></span>
      <button class="action primary" onclick="saveNotas()">Guardar notas</button>
    </div>
  </div>

  <div id="searchAllPanel" style="display:none;">
    <input id="searchAllInput" placeholder="Buscar por palabra en materiales, productos y máquinas..." style="width:100%;background:var(--steel-850);border:1px solid var(--line);color:var(--paper);padding:12px 14px;border-radius:5px;font-size:14px;font-family:'Inter',sans-serif;margin-bottom:16px;">
    <div id="searchAllResults"></div>
  </div>
</div>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Nuevo material</h3>
    <div class="fld"><label>Nombre *</label><input id="f_nombre" placeholder="Ej. Metacrilato 3mm"></div>
    <div class="fld">
      <label>Categoría</label>
      <select id="f_categoria">
        <option value="">Sin categoría</option>
        <option value="Láser">Láser</option>
        <option value="Rotulación">Rotulación</option>
        <option value="Merchandising">Merchandising</option>
        <option value="Imprenta">Imprenta</option>
        <option value="Textil">Textil</option>
        <option value="Papel">Papel</option>
        <option value="General">General</option>
      </select>
    </div>
    <div class="fld" id="fld_especificaciones"><label>Especificaciones</label><textarea id="f_especificaciones" placeholder="Según el elemento: grosores, formatos, acabados, capacidades técnicas, velocidad, tamaño de trabajo..."></textarea></div>
    <div class="fld" id="fld_variantes" style="display:none;"><label>Variantes</label><textarea id="f_variantes" placeholder="Tamaños, número de copias, autocopiativo o no, encuadernado, acabados posibles..."></textarea></div>
    <div class="fld" id="fld_materialesUsados" style="display:none;">
      <label>Materiales que usa</label>
      <div id="checksMateriales" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>
    <div class="fld" id="fld_maquinasUsadas" style="display:none;">
      <label>Máquinas que usa</label>
      <div id="checksMaquinas" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>
    <div class="fld" id="fld_materialesCompatibles" style="display:none;">
      <label>Materiales</label>
      <div id="checksMaterialesMaquina" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>
    <div class="fld" id="fld_tamanos" style="display:none;"><label>Tamaños</label><textarea id="f_tamanos" placeholder="Tamaño máximo/mínimo de trabajo, formatos admitidos..."></textarea></div>
    <div class="fld" id="fld_colores" style="display:none;"><label>Colores</label><textarea id="f_colores" placeholder="Colores o tintas disponibles en esta máquina..."></textarea></div>
    <div class="fld" id="fld_varios" style="display:none;"><label>Varios</label><textarea id="f_varios" placeholder="Cualquier otra cosa a tener en cuenta..."></textarea></div>
    <div class="fld" id="fld_notas"><label>Notas</label><textarea id="f_notas" placeholder="Notas técnicas, proveedores, tiempos de producción..."></textarea></div>
    <div class="modalBtns">
      <button class="action danger" id="deleteBtn" style="display:none;" onclick="deleteMaterial()">Eliminar</button>
      <div class="right">
        <button class="action" onclick="closeModal()">Cancelar</button>
        <button class="action primary" onclick="submitMaterial()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const FN_MATERIALES = '/.netlify/functions/gm-materiales';
let materiales = [];
let productos = [];
let maquinas = [];
let vehiculos = [];
let currentTab = 'materiales';
let crmPassword = null;
let editingId = null;

const PRODUCTOS_DEFAULT = ['Talonarios','Revistas','Monítico','Cartelería','Neones','Sellos','Banderolas','Loterías','Cartas y menús'];
const MATERIALES_DEFAULT = ['PVC','Cartón pluma','Aluminio','Metacrilato','Madera','Lona','Vinilo','Glass pack'];

// Catálogo técnico Endutex (materiales técnicos rígidos) - se usa para rellenar huecos vacíos, nunca pisa lo ya escrito

  },

async function syncCatalogoMateriales(){
  for(const nombre in CATALOGO_MATERIALES){
    const datos = CATALOGO_MATERIALES[nombre];
    const existente = materiales.find(m => m.nombre.trim().toLowerCase() === nombre.toLowerCase());
    try{
      if(!existente){
        const data = await apiCall('POST', 'materiales', { material: { nombre, categoria: datos.categoria, especificaciones: datos.especificaciones, notas: '' } });
        materiales.unshift(data.material);
      } else if(!existente.especificaciones){
        const patch = { especificaciones: datos.especificaciones };
        if(!existente.categoria && datos.categoria) patch.categoria = datos.categoria;
        const data = await apiCall('PUT', 'materiales', { id: existente.id, patch });
        const idx = materiales.findIndex(x => x.id === existente.id);
        if(idx>-1) materiales[idx] = data.material;
      }
    }catch(err){ /* seguimos con el resto si falla uno */ }
  }
}

async function fetchColeccion(coleccion){
  const r = await fetch(`${FN_MATERIALES}?coleccion=${coleccion}`, { headers: { 'x-crm-password': crmPassword } });
  if(r.status === 401) throw new Error('401');

async function attemptLoad(fromLoginForm){
  const errEl = document.getElementById('loginError');
  errEl.textContent = fromLoginForm ? 'Comprobando...' : '';
  try{
    materiales = await fetchColeccion('materiales');
    productos = await fetchColeccion('productos');
    maquinas = await fetchColeccion('maquinas');
    localStorage.setItem('gm_crm_pass', crmPassword);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').classList.add('ready');
    if(materiales.length === 0){ await seedDefaults('materiales', MATERIALES_DEFAULT); }
    if(productos.length === 0){ await seedDefaults('productos', PRODUCTOS_DEFAULT); }
    await syncDefaultsFaltantes('maquinas', MAQUINAS_DEFAULT);
    await syncCatalogoMateriales();
    renderGrid();
  }catch(err){
    if(err.message === '401'){
      errEl.textContent = 'Contraseña incorrecta.';
      localStorage.removeItem('gm_crm_pass');
    } else {
      errEl.textContent = 'No se pudo conectar. Comprueba tu conexión e inténtalo de nuevo.';
    }
  }
}

async function syncDefaultsFaltantes(coleccion, nombres){
  const list = coleccion === 'materiales' ? materiales : coleccion === 'productos' ? productos : maquinas;
  const itemKey = coleccion === 'materiales' ? 'material' : coleccion === 'productos' ? 'producto' : 'maquina';
  const defaults = coleccion === 'materiales'
    ? (nombre) => ({ nombre, categoria: '', especificaciones: '', notas: '' })
    : coleccion === 'productos'
      ? (nombre) => ({ nombre, categoria: '', variantes: '', especificaciones: '', notas: '' })
      : (nombre) => ({ nombre, categoria: '', materialesUsados: [], tamanos: '', colores: '', varios: '' });
  for(const nombre of nombres){
    const existe = list.some(x => x.nombre.trim().toLowerCase() === nombre.toLowerCase());
    if(existe) continue;
    try{
      const data = await apiCall('POST', coleccion, { [itemKey]: defaults(nombre) });
      list.unshift(data[itemKey]);
    }catch(err){ /* seguimos con el resto si falla uno */ }
  }
}

async function seedDefaults(coleccion, nombres){
  const target = coleccion === 'materiales' ? materiales : coleccion === 'productos' ? productos : maquinas;
  const itemKey = coleccion === 'materiales' ? 'material' : coleccion === 'productos' ? 'producto' : 'maquina';
  const defaults = coleccion === 'materiales'
    ? (nombre) => ({ nombre, categoria: '', especificaciones: '', notas: '' })
    : coleccion === 'productos'
      ? (nombre) => ({ nombre, categoria: '', variantes: '', especificaciones: '', notas: '' })
      : (nombre) => ({ nombre, categoria: '', materialesUsados: [], tamanos: '', colores: '', varios: '' });
  for(const nombre of nombres){
    try{
      const data = await apiCall('POST', coleccion, { [itemKey]: defaults(nombre) });
      target.unshift(data[itemKey]);
    }catch(err){ /* si falla uno, seguimos con el resto */ }
  }
}

function showToast(msg){

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
async function apiCall(method, coleccion, payload){
  const r = await fetch(FN_MATERIALES, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ password: crmPassword, coleccion }, payload || {}))
  });
  if(r.status === 401){ showToast('Sesión no autorizada. Vuelve a entrar.'); localStorage.removeItem('gm_crm_pass'); location.reload(); throw new Error('401'); }
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'Error del servidor');
  return data;
}

function normalizeText(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const list = getCurrentList();
  const q = normalizeText(document.getElementById('searchInput').value);
  const cat = document.getElementById('categoryFilter').value;
  const filtered = list.filter(m=>{
    const matchQ = !q
      || normalizeText(m.nombre).includes(q)
      || normalizeText(m.especificaciones).includes(q)
      || normalizeText(m.variantes).includes(q)
      || normalizeText(m.materialesCompatibles).includes(q)
      || normalizeText(m.tamanos).includes(q)
      || normalizeText(m.colores).includes(q)
      || normalizeText(m.varios).includes(q)
      || normalizeText((m.materialesUsados||[]).join(' ')).includes(q)
      || normalizeText((m.maquinasUsadas||[]).join(' ')).includes(q);
    const matchCat = !cat || m.categoria === cat;
    return matchQ && matchCat;
  });
  if(filtered.length===0){
    const labels = { materiales: 'material', productos: 'producto', maquinas: 'máquina', vehiculos: 'vehículo' };
    const label = labels[currentTab];
    grid.innerHTML = `<div id="emptyList" style="grid-column:1/-1;">${list.length===0 ? `Todavía no hay ${label}s. Añade el primero con "+ Añadir ${label}".` : 'Sin resultados para ese filtro.'}</div>`;
    return;
  }
  grid.innerHTML = filtered.map(m=>{
    if(currentTab === 'maquinas'){
      return `
      <div class="card">
        <div class="cardTop">
          <div>
            <h3>${escapeHtml(m.nombre)}</h3>
            <span class="cat ${m.categoria?'':'empty'}">${escapeHtml(m.categoria || 'Sin categoría')}</span>
          </div>
          <div class="cardBtns"><button class="iconBtn" onclick="openEdit('${m.id}')">Editar</button></div>
        </div>
        <label>Materiales</label>
        <div class="chipRow">${(m.materialesUsados||[]).length ? m.materialesUsados.map(n=>`<span class="chip gm" style="cursor:pointer;" onclick="abrirMaterialPorNombre('${escapeHtml(n).replace(/'/g,"\\'")}')">${escapeHtml(n)}</span>`).join('') : `<span class="val empty">Sin datos todavía.</span>`}</div>
        <label>Tamaños</label>
        <div class="val ${m.tamanos?'':'empty'}">${m.tamanos ? escapeHtml(m.tamanos) : 'Sin datos todavía.'}</div>
        <label>Colores</label>
        <div class="val ${m.colores?'':'empty'}">${m.colores ? escapeHtml(m.colores) : 'Sin datos todavía.'}</div>
        ${m.varios ? `<label>Varios</label><div class="val">${escapeHtml(m.varios)}</div>` : ''}
      </div>`;
    }
    return `
    <div class="card">
      <div class="cardTop">
        <div>
          <h3>${escapeHtml(m.nombre)}</h3>
          <span class="cat ${m.categoria?'':'empty'}">${escapeHtml(m.categoria || 'Sin categoría')}</span>
        </div>
        <div class="cardBtns">
          <button class="iconBtn" onclick="openEdit('${m.id}')">Editar</button>
        </div>
      </div>
      ${(currentTab==='productos'||currentTab==='vehiculos') ? `<label>Variantes</label><div class="val ${m.variantes?'':'empty'}">${m.variantes ? escapeHtml(m.variantes) : 'Sin variantes todavía.'}</div>` : ''}
      ${currentTab==='productos' && (m.materialesUsados||[]).length ? `<label>Materiales que usa</label><div class="chipRow">${m.materialesUsados.map(n=>`<span class="chip gm">${escapeHtml(n)}</span>`).join('')}</div>` : ''}
      ${currentTab==='productos' && (m.maquinasUsadas||[]).length ? `<label>Máquinas que usa</label><div class="chipRow">${m.maquinasUsadas.map(n=>`<span class="chip">${escapeHtml(n)}</span>`).join('')}</div>` : ''}
      <label>Especificaciones</label>
      <div class="val ${m.especificaciones?'':'empty'}">${m.especificaciones ? escapeHtml(m.especificaciones) : 'Sin especificaciones todavía.'}</div>
      ${m.notas ? `<label>Notas</label><div class="val">${escapeHtml(m.notas)}</div>` : ''}
    </div>`;
  }).join('');
}

  const sel = seleccionados || [];

    return `<label class="checkChip ${checked?'checked':''}">
      <input type="checkbox" value="${escapeHtml(nombre)}" ${checked?'checked':''} onchange="this.closest('label').classList.toggle('checked', this.checked)">
      ${escapeHtml(nombre)}
    </label>`;
  }).join('') || '<span style="color:var(--paper-dim);font-size:12px;">Añade materiales o máquinas primero en sus pestañas.</span>';

async function submitMaterial(){
  const nombre = document.getElementById('f_nombre').value.trim();
  if(!nombre){ showToast('El nombre es obligatorio.'); return; }
  const itemKey = getItemKey();
  const payload = { nombre, categoria: document.getElementById('f_categoria').value };
  if(currentTab === 'maquinas'){
    payload.materialesUsados = getChecked('checksMaterialesMaquina');
    payload.tamanos = document.getElementById('f_tamanos').value.trim();
    payload.colores = document.getElementById('f_colores').value.trim();
    payload.varios = document.getElementById('f_varios').value.trim();
  } else {
    payload.especificaciones = document.getElementById('f_especificaciones').value.trim();
    payload.notas = document.getElementById('f_notas').value.trim();
    if(currentTab==='productos'||currentTab==='vehiculos') payload.variantes = document.getElementById('f_variantes').value.trim();
    if(currentTab==='productos'){
      payload.materialesUsados = getChecked('checksMateriales');
      payload.maquinasUsadas = getChecked('checksMaquinas');
    }
  }
  const labels = { materiales: 'Material', productos: 'Producto', maquinas: 'Máquina', vehiculos: 'Vehículo' };
  try{
    const list = getCurrentList();
    if(editingId){
      const data = await apiCall('PUT', currentTab, { id: editingId, patch: payload });
      const idx = list.findIndex(x=>x.id===editingId);
      if(idx>-1) list[idx] = data[itemKey];
      showToast(labels[currentTab] + ' actualizado.');
    } else {
      const data = await apiCall('POST', currentTab, { [itemKey]: payload });
      list.unshift(data[itemKey]);
      showToast(labels[currentTab] + ' añadido.');
    }
    closeModal();
    renderGrid();
  }catch(err){ showToast('No se pudo guardar: ' + err.message); }
}

async function deleteMaterial(){
  if(!editingId) return;
  if(!confirm('¿Eliminar este elemento? No se puede deshacer.')) return;
  try{
    await apiCall('DELETE', currentTab, { id: editingId });
    if(currentTab === 'materiales') materiales = materiales.filter(x=>x.id!==editingId);
    else if(currentTab === 'productos') productos = productos.filter(x=>x.id!==editingId);
    else if(currentTab === 'maquinas') maquinas = maquinas.filter(x=>x.id!==editingId);
    else vehiculos = vehiculos.filter(x=>x.id!==editingId);
    closeModal();
    renderGrid();
    showToast('Eliminado.');
  }catch(err){ showToast('No se pudo eliminar: ' + err.message); }
}

      notas: notasGen.texto || '',
      rotulacionVehiculos: notasVeh.texto || ''
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `graficasmera-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Copia descargada.');
  }catch(err){ showToast('No se pudo exportar: ' + err.message); }
}

function renderSearchAll(){
  const wrap = document.getElementById('searchAllResults');
  const q = normalizeText(document.getElementById('searchAllInput').value);
  if(!q){
    wrap.innerHTML = `<div id="emptyList">Escribe una palabra para buscar en materiales, productos y máquinas a la vez.</div>`;
    return;
  }
  const fuentes = [
    { tipo: 'materiales', label: 'Material', lista: materiales },
    { tipo: 'productos', label: 'Producto', lista: productos },
    { tipo: 'maquinas', label: 'Máquina', lista: maquinas }
  ];
  let resultados = [];
  fuentes.forEach(f=>{
    f.lista.forEach(item=>{
      const texto = normalizeText([
        item.nombre, item.categoria, item.especificaciones, item.variantes,
        item.materialesCompatibles, item.tamanos, item.colores, item.varios,
        (item.materialesUsados||[]).join(' '), (item.maquinasUsadas||[]).join(' ')
      ].join(' '));
      if(texto.includes(q)) resultados.push({ tipo: f.tipo, label: f.label, item });
    });
  });
  if(resultados.length === 0){
    wrap.innerHTML = `<div id="emptyList">Sin resultados para "${escapeHtml(document.getElementById('searchAllInput').value)}".</div>`;
    return;
  }
  wrap.innerHTML = `<div id="grid" style="display:grid;">${resultados.map(r=>`
    <div class="card" style="cursor:pointer;" onclick="irAResultado('${r.tipo}','${r.item.id}')">
      <div class="cardTop">
        <div>
          <h3>${escapeHtml(r.item.nombre)}</h3>
          <span class="cat">${r.label}</span>
        </div>
      </div>
    </div>
  `).join('')}</div>`;
}
document.getElementById('searchAllInput')?.addEventListener('input', renderSearchAll);

function abrirMaterialPorNombre(nombre){
  const mat = materiales.find(x => x.nombre === nombre);
  if(!mat){ showToast('Ese material ya no existe.'); return; }
  switchTab('materiales');
  setTimeout(()=>openEdit(mat.id), 60);
}

function irAResultado(tipo, id){
  switchTab(tipo);
  setTimeout(()=>openEdit(id), 60);
}
document.getElementById('addBtn').addEventListener('click', openModal);
document.getElementById('searchInput').addEventListener('input', renderGrid);
document.getElementById('categoryFilter').addEventListener('change', renderGrid);
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
</script>
